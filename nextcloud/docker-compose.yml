version: '3.8'

services:
  nextcloud-db:
    image: mariadb:10.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud_root_password
      - MYSQL_PASSWORD=nextcloudpass
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=duylong
    networks:
      - nextcloud

  nextcloud-app:
    image: nextcloud:latest
    restart: always
    ports:
      - 6699:80
    links:
      - nextcloud-db
    volumes:
      - nextcloud:/var/www/html
      - ./data:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=nextcloudpass
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=duylong
      - MYSQL_HOST=nextcloud-db
      - NEXTCLOUD_ADMIN_USER=duylongadmin
      - NEXTCLOUD_ADMIN_PASSWORD=nextcloudadminpass
    networks:
      - nextcloud

volumes:
  db:
  nextcloud:

networks:
  nextcloud: